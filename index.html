<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>恩典寶盒</title>
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; 
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: url('images/bg_church.png') no-repeat center center fixed;
            background-size: cover;
            background-color: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 15px;
            overflow: hidden; 
        }

        h1 {
            font-size: 24px;
            margin: 15px 0 5px 0;
            color: #FFE082;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            letter-spacing: 2px;
        }

        .intro-text {
            width: 90%;
            text-align: center;
            color: #FFFFFF;
            margin-bottom: 15px;
            font-size: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .wheel-outer-container {
            position: relative;
            width: 320px;
            height: 320px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .wheel-img {
            width: 100%;
            height: 100%;
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }

        .center-cross {
            position: absolute;
            width: 140px; 
            height: 140px;
            top: 50%;
            left: 50%;
            margin-top: -70px; 
            margin-left: -70px; 
            z-index: 5;
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 45px;
            z-index: 10;
        }

        /* --- 強化的閃爍光雲效果 --- */
        .btn-wrapper {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            width: 100%;
        }

        .glow-cloud {
            position: absolute;
            width: 180px; 
            height: 60px;
            /* 使用更高亮度的白色與金黃色 */
            background: radial-gradient(circle, rgba(255,255,255,0.9) 0%, rgba(255,215,0,0.5) 40%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            filter: blur(12px);
            z-index: 1;
            /* 增加外發光陰影，讓光雲更厚實明顯 */
            box-shadow: 0 0 30px 15px rgba(255, 255, 255, 0.4), 
                        0 0 50px 30px rgba(255, 215, 0, 0.2);
            animation: intenseFlicker 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes intenseFlicker {
            0%, 100% { 
                transform: scale(0.9); 
                opacity: 0.3; 
                filter: blur(10px);
            }
            50% { 
                transform: scale(1.3); 
                opacity: 1; 
                filter: blur(15px);
            }
        }

        .spin-btn {
            position: relative;
            z-index: 2;
            background: linear-gradient(135deg, #FFD54F, #F57F17);
            border: 2px solid #FFF; /* 增加白邊讓按鈕更突顯 */
            padding: 15px 50px;
            border-radius: 35px;
            font-size: 22px;
            font-weight: bold;
            color: #3E2723;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .spin-btn:active {
            transform: scale(0.95);
        }

        /* --- 模態框與卡片 --- */
        #modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 100;
        }

        #card-modal {
            display: none;
            position: fixed;
            bottom: 10%; 
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 400px;
            z-index: 101;
            animation: slideUp 0.5s cubic-bezier(0.17, 0.89, 0.32, 1.1);
        }

        @keyframes slideUp {
            from { transform: translate(-50%, 30%); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        .card-container { position: relative; width: 100%; }
        #reward-card-img { width: 100%; display: block; border-radius: 20px; }
        #card-content {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; 
            padding: 30px; color: #3E2723;
        }

        .item-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; text-align: center; }
        .bible-verse { font-size: 18px; font-weight: 600; color: #4E342E; margin-bottom: 5px; text-align: left; line-height: 1.4; }
        .verse-source { font-size: 13px; color: #795548; text-align: right; margin-bottom: 10px; }
        .comfort-text { font-size: 17px; color: #5D4037; border-top: 1.5px solid rgba(121, 85, 72, 0.3); padding-top: 10px; line-height: 1.5; }

        .close-btn {
            display: block; margin: 15px auto 0; background: #FFE082; border: none;
            padding: 12px 40px; border-radius: 25px; color: #3E2723; font-weight: bold;
            font-size: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
    
        .music-control { position: fixed; bottom: 20px; right: 20px; z-index: 2000; }
        #music-toggle {
            background: rgba(0, 0, 0, 0.6); border: 2px solid #FFE082; color: #FFE082;
            padding: 10px; border-radius: 50%; width: 50px; height: 50px; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
        }

    </style>
</head>
<body>

    <h1>恩典寶盒</h1>
    <div class="intro-text">在迷茫與疲乏時，願上帝應許給你安慰</div>

    <div class="wheel-outer-container">
        <img src="images/pointer.png" class="pointer">
        <img src="images/wheel.png" id="wheel" class="wheel-img">
        <img src="images/cross.png" class="center-cross">
    </div>

    <div class="btn-wrapper" id="spin-area">
        <div class="glow-cloud" id="btn-glow"></div>
        <button class="spin-btn" id="spin-trigger" onclick="spinWheel()">領取恩典</button>
    </div>

    <div id="modal-overlay" onclick="closeCard()"></div>
    <div id="card-modal">
        <div class="card-container">
            <img id="reward-card-img" src="images/card_001.png">
            <div id="card-content"></div>
        </div>
        <button class="close-btn" onclick="closeCard()">按此返回</button>
    </div>

    <audio id="sound-spin" src="audio/spin.mp3" preload="auto"></audio>
    <audio id="sound-ding" src="audio/ding.mp3" preload="auto"></audio>
    <audio id="bg-music" src="audio/bgmusic.mp3" loop preload="auto" muted></audio>

    <div class="music-control">
        <button id="music-toggle" onclick="toggleMusic()">🔇</button>
    </div>

    <script>
        const themes = [
            { name: "皇冠", options: [{ comfort: "你是尊貴的兒女，主已為你預備了生命的冠冕。", verse: "「必有公義的冠冕為我存留。」— 提摩太後書 4:8" }] },
            { name: "樹苗", options: [{ comfort: "雖如微小的種子，但在恩典中必能茁壯。", verse: "「他要像一棵樹栽在溪水旁。」— 詩篇 1:3" }] },
            { name: "夕陽", options: [{ comfort: "歇下勞苦，安穩入睡，主應許早晨必有歡呼。", verse: "「一宿雖然有哭泣，早晨便必歡呼。」— 詩篇 30:5" }] },
            { name: "白鴿", options: [{ comfort: "讓聖靈如鴿子降臨你心，賜下平安。", verse: "「我留下平安給你們。」— 約翰福音 14:27" }] },
            { name: "酒杯", options: [{ comfort: "祂的恩典使你的福杯滿溢，主是你的泉源。", verse: "「使我的福杯滿溢。」— 詩篇 23:5" }] },
            { name: "燈台", options: [{ comfort: "即便身處幽暗，主的話是你腳前的燈。", verse: "「你的話是我腳前的燈。」— 詩篇 119:105" }] },
            { name: "盾牌", options: [{ comfort: "主是你的避難所，祂的信實是你的盾牌。", verse: "「耶和華是我的力量，是我的盾牌。」— 詩篇 28:7" }] },
            { name: "鎖匙", options: [{ comfort: "主必為你開那無人能關的門。", verse: "「拿著大衛鑰匙的，開了就無人能關。」— 啟示錄 3:7" }] },
            { name: "百合", options: [{ comfort: "看那野地的百合花，主更必顧念你。", verse: "「你想野地裡的百合花怎麼長起來。」— 馬太福音 6:28" }] },
            { name: "葡萄", options: [{ comfort: "常在主裡面，生命就必多結果子。", verse: "「我是葡萄樹，你們是枝子。」— 約翰福音 15:5" }] },
            { name: "爉燭", options: [{ comfort: "哪怕只有微弱的光，主必不吹滅。", verse: "「將殘的燈火，他不吹滅。」— 馬太福音 12:20" }] },
            { name: "星星", options: [{ comfort: "仰望星空，主的應許如繁星般永恆。", verse: "「智慧人必發光，如同天上的光。」— 但以理書 12:3" }] }
        ];

        let spinning = false;
        let currentRotation = 0;
        const bgMusic = document.getElementById('bg-music');
        const musicBtn = document.getElementById('music-toggle');

        function spinWheel() {
            if (spinning) return;
            if (bgMusic.paused) {
                bgMusic.muted = false;
                bgMusic.play().catch(e => {});
                musicBtn.innerHTML = "🔊";
            }

            spinning = true;
            document.getElementById('spin-area').style.visibility = 'hidden';

            const wheel = document.getElementById('wheel');
            const spinAudio = document.getElementById('sound-spin');
            spinAudio.play().catch(()=>{});

            const randomExtra = Math.floor(Math.random() * 360);
            currentRotation += (3600 + randomExtra); 
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                const actualDeg = (360 - (currentRotation % 360)) % 360;
                const themeIndex = Math.floor(actualDeg / 30);
                const theme = themes[themeIndex] || themes[0];
                showCard(theme.name, theme.options[0]);
                document.getElementById('sound-ding').play().catch(()=>{});
                spinning = false;
            }, 4000);
        }

        function showCard(themeName, option) {
            const randomImgNum = Math.floor(Math.random() * 3) + 1;
            document.getElementById('reward-card-img').src = `images/card_00${randomImgNum}.png`;
            const parts = option.verse.split('—');
            document.getElementById('card-content').innerHTML = `
                <div class="item-title">【${themeName}】</div>
                <div class="bible-verse">${parts[0]}</div>
                <div class="verse-source">— ${parts[1]}</div>
                <div class="comfort-text">${option.comfort}</div>
            `;
            document.getElementById('modal-overlay').style.display = 'block';
            document.getElementById('card-modal').style.display = 'block';
        }

        function closeCard() {
            document.getElementById('modal-overlay').style.display = 'none';
            document.getElementById('card-modal').style.display = 'none';
            document.getElementById('spin-area').style.visibility = 'visible';
        }

        function toggleMusic() {
            if (bgMusic.paused || bgMusic.muted) {
                bgMusic.muted = false; bgMusic.play(); musicBtn.innerHTML = "🔊";
            } else {
                bgMusic.pause(); musicBtn.innerHTML = "🔇";
            }
        }
    </script>
</body>
</html>
